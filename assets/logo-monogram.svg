<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Tech Slate/Onyx -->
    <linearGradient id="yk-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#040711"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Silver / White Specular Gradient for Y -->
    <linearGradient id="yk-silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Electric Cyan to Royal Blue to Violet Gradient for K -->
    <linearGradient id="yk-cyan-violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Core Ambient Radial Glow -->
    <radialGradient id="yk-glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.3)"/>
      <stop offset="70%" stop-color="rgba(56, 189, 248, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Subtle Tech Frame Border -->
    <linearGradient id="yk-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)"/>
      <stop offset="50%" stop-color="rgba(99, 102, 241, 0.5)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.25)"/>
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="yk-shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Frame Badge -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#yk-bg-grad)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#yk-glow-grad)"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#yk-border-grad)" stroke-width="1.6"/>

  <!-- Intertwined YK Monogram Vector Geometry -->
  <g filter="url(#yk-shadow-filter)">
    <!-- 1. K Vertical Spine (Base Layer) -->
    <path d="M 50 24 L 50 76" 
          fill="none" 
          stroke="url(#yk-cyan-violet-grad)" 
          stroke-width="8" 
          stroke-linecap="round"/>

    <!-- 2. K Lower Diagonal Branch -->
    <path d="M 50 50 L 76 76" 
          fill="none" 
          stroke="url(#yk-cyan-violet-grad)" 
          stroke-width="8" 
          stroke-linecap="round"/>

    <!-- 3. Y Intertwining Across K (Stem & Left Arm) -->
    <path d="M 22 24 L 37 47 L 37 76" 
          fill="none" 
          stroke="url(#yk-silver-grad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Y Right Arm weaving OVER K's spine -->
    <path d="M 52 24 L 37 47" 
          fill="none" 
          stroke="url(#yk-silver-grad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 4. K Upper Diagonal Branch (Front dynamic stroke) -->
    <path d="M 50 46 L 76 24" 
          fill="none" 
          stroke="url(#yk-cyan-violet-grad)" 
          stroke-width="8" 
          stroke-linecap="round"/>
          
    <!-- Specular Apex Highlight Accent -->
    <circle cx="50" cy="24" r="2.5" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>